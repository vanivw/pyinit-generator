[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyinit"
version = "0.1.0"
description = "Minimal Spring-Initializr-style project generator for Python"
authors = [{name = "You", email = "you@example.com"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["jinja2>=3.1", "typer>=0.12.0", "pyyaml>=6.0"]
keywords = ["project-generator", "scaffold", "template", "initializr"]
license = {text = "MIT"}

[project.scripts]
pyinit = "pyinit.cli:app"

[tool.rye]
managed = true

[tool.hatch.build.targets.wheel]
packages = ["pyinit"]